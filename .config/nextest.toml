# Minimum cargo-nextest for this repository: GHSA-vc25-qg58-w57c is fixed in 0.9.150 and CI
# installs exactly that version, so an older nextest refuses to run (exit 92 REQUIRED_VERSION_NOT_MET).
nextest-version = "0.9.150"

# A test that waits for ever (a socket that is never answered, a child process that never ends) must fail, not hold the
# gate until someone notices: a test running longer than 30 seconds is reported as slow, and killed and failed after
# four periods, 120 seconds. Nearly every test takes under a second, and the four that take a minute have a limit of their own
# at the end of this file; raise a test's limit only if it really needs longer, with a comment saying why.
[profile.default]
slow-timeout = { period = "30s", terminate-after = 4 }

# The tests that hold a lot of memory at once. nextest runs one process for each test, as many at a time as there are CPUs, and
# the gate is run in places with less memory than a workstation (a runner of a few gigabytes, an agent's scope of 20 GB): 32 of the
# tests below running together reached 20 GB, and the kernel stopped the run (the memory tests of `diacraft-odg`, `diacraft-opc` and
# the engine, which start a child under `ulimit -v 3000000` or build a drawing of 350,000 shapes, and the cost tests of the readers,
# which build a page of a million shapes). So the tests that peak at 500 MB or more, run alone, share two places: the others still run
# at the full width. The list is by what the tests do, measured: the peak resident memory of each test of the workspace run in a process
# of its own (`/usr/bin/time`), the 56 of 6,203 that came to 500 MB or more, the most 2.9 GB (the group's two together are under
# 6 GB). A test that is new and builds a gigabyte, or starts a child under `ulimit -v`, goes into the list: say what it does in the commit.
# Add fourteen: the children of `memory_price.rs` that read a file of 250 MB of UTF-16, of chains of nested elements or of a gigabyte of XML (1.1 to 2.4 GB of
# address space each), and the children of the engine's `vsdx_memory.rs`, the window's `file_open` and the command line's `roundtrip` that hold a drawing of 80,000 shapes (1.7 GB) beside a second read.
# The content check's child-process tests (`canon_memory`) peak, one at a time, at 585 MB (a part at its item budget against
# one past it, which is listed below), 305 MB (a part past the budget refused before its partner is read: under 500 MB, so not listed, since the
# budget of 2 million items replaced the parser's 6 million that made it peak at 0.9 GB), 228 MB (a paragraph of 32 MiB) and 11 MB (an attribute
# and a depth past their limits): only the first is in the group.
# Adds three: the children of `model_hostile.rs` (the VSDX model writer under `ulimit -v 3000000`: three parts of 256 MiB made of noise and refused in words, six of 40 MiB written, and a drawing of 76,000 shapes
# over three pages with parts held, 2.79 GB of address space).
# Adds three: a part of 256 MiB and one byte (the 512 MiB it and its copy take, in the process), and the children of `carry.rs` under `ulimit -v 3000000`: three carried parts of 256 MiB of
# noise refused in words (they are made in the child: 0.8 GB, 1.5 GB at the copy), and four of 32 MiB written and read back; the part of 64 MiB and 16 bytes of `diacraft_part` (the cap of the solution part).
# Adds two: the children of `objects.rs` under `ulimit -v 3000000`: an object of 256 MiB and one byte (made of noise in the child, 0.6 GB, refused in words by the carrier) and one of exactly 256 MiB
# written as an embedding by two writers (1.15 GB of address space).
# Add the engine's children of `vsdx_held_parts` (two parts of 256 MiB saved twice, and one: up to 2.6 GB) and of `vsdx_embedded_peak` (three embedded objects
# of 240 MiB, and two of 256 MiB beside 20,000 shapes, each saved twice under `ulimit -v 3000000`: 1.8 and 1.7 GB in the child, and the parent makes a file of up to 760 MB first).
# Adds two of the four children of `docfile_memory` of `diacraft-odg`, each started under `ulimit -v 3000000`: a document file of 3.9 million `shape`
# elements (698 MB) and 60,000 masters of 60 shapes, refused at the reader's items (979 MB). The other two peak at 245 MB (a master of 300,000 shapes saved) and 226 MB (masters of
# 1.2 million cells, refused before a tree is made), and are not listed.
# Adds four more children to it: a document file of 3.9 million `master` elements (515 MB: listed, since a loaded machine puts it past 500), and masters of 100 MB of
# kept text each refused by the gate (211 MB), and a master of 400,000 shapes read with and without its own declaration of the namespace (207 MB each): the last three are not listed.
# The flat path's (`canon_memory` of `diacraft-odg`) peak at 486 MB (100 MB of inline picture text refused before it is decoded: listed,
# since a loaded machine puts it past 500), 329 MB (a paragraph of 30 MiB on each side), 314 MB, 278 MB, 276 MB, 100 MB and 90 MB, and the cost tests of
# `canon_scale` at 285 MB and under: none of the others is listed.
# The engine's `.diacraft` children (`native_memory`) peak, one at a time, at 884 MB (a file of 340 MB open alone), 708 MB (the same beside a hold of 1.9 GB), 421 MB (two sessions: listed, since a loaded
# machine puts it past 500), 258 MB (a save beside a hold of 2.3 GB: not listed), 877 MB (a drawing of 30,000 shapes edited everywhere and saved, and a file of 150 MB read beside it) and a template of
# 340 MB refused beside a hold of 1.9 GB (a few hundred MB: the template is made in the child, and listed with the others that make a file of that size).
# The engine's `read_room` children write files of 900 MB and read one at a time: they peak at about 1 GB (the second, one file's), and the first at a few hundred MB.
# Adds four: the children of `model_memory` of `diacraft-odg` (the `.odg` model writer under `ulimit -v 3000000`): four parts of 200 MiB of noise refused before a byte is made (1.0 GB), three of 190 MiB
# refused by the plan's gate (0.8 GB), two of 200 MiB written (1.4 GB) and two of 100 MiB written (0.7 GB); the fifth, a settings tree of a million nodes refused by the bound (119 MB), is not listed.
# Adds two: the children of `carry_cost` of `diacraft-odg` (the `.odg` carrier under `ulimit -v 3000000`): three carried parts of 256 MiB of noise refused by the save's memory gate (1.1 GB of address space)
# and three of 180 MiB refused by the carrier's own cap of 512 MiB (0.83 GB); the child that writes and reads back four of 32 MiB (0.39 GB) is not listed.
# Adds four: the cost tests of `canon_free_names_scale` of `diacraft-odg` (the content check of two drawings of 100,000 automatic styles each, in the test's own process: 0.50 to 0.59 GB).
# Adds one: the child of `pictures` under `ulimit -v 3000000` that inserts eight pictures of 60 MiB, each made, read and put in a drawing that holds 480 MiB of them, and is refused at the ninth (0.7 GB).
# Adds one: `swimlane_cells` writes a drawing of 100,000 containers, each naming the next as its list, opens it, asks it for its swimlanes and moves one (1.3 GB, measured on beast).
# Adds three (`save_check_before`, peak resident memory measured on beast, 2026-11-25): 100,000 shapes of one number asked about and saved as `.odg` and as `.diacraft` (1.17 GB), 20,000 shapes asked about
# and saved through each writer (0.53 GB), and the child test that asks about a part of 256 MiB and saves it under `ulimit -v 3000000` (the child 1.07 GB, and the parent that makes the file 0.5 GB).
# Adds one: `sheet_rows::a_section_at_the_most_rows_the_model_holds_takes_no_more` builds a Scratch section of 320,000 rows (the most the model holds) and refuses one more (0.62 GB,
# measured on beast, 2026-11-26); the renumber of 30,000 shapes (0.26 GB) and the others of that file are not listed.
# Adds two (`conn_points_edges`, peak resident memory measured on beast, 2026-11-26): a drawing of one section of 200,000 rows read and counted by `shape.connection_edges` (0.57 GB), and the same
# of 200,000 steps of no length (0.51 GB): the drawing and its merged rows are held at once.
[test-groups.memory-heavy]
max-threads = 2

