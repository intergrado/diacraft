test-group = "memory-heavy"

# The package's own memory tests (`crates/native/tests/it/memory.rs`): each runs a child process under `ulimit -v 3000000` that holds a model, a package and the
# pictures of a drawing at once (measured on beast, 2026-11-21: 1,084 MB for two pictures of 150 MiB written and read again, 482 MB for a part of 120 MB, 210 MB for the
# two that are refused for the memory that is left, 8 MB for the records and 7 MB for the file over the cap). Every one of the six is in the group, so that two run at once at the most.
[[profile.default.overrides]]
filter = '''
      package(diacraft-native) & test(/^memory::/)
'''
test-group = "memory-heavy"

# The draw.io reader's tests of a page of a million cells (`crates/mxfile/tests/it/hostile.rs`, every test named `cells_...`; peak resident memory measured on beast,
# 2026-11-26): 0.78 GB for a chain, a cycle and one id of a million cells each, 0.82 GB for a million ids made to collide, 0.66 GB for a million cells exactly, 0.53 GB for 300,000 cells that
# each have three things wrong, 0.36 GB for a hundred connectors of ten thousand waypoints, and 0.25 GB or less for the rest. The page's tree and its cells are held at once, 700 bytes a cell.
[[profile.default.overrides]]
filter = '''
      package(diacraft-mxfile) & test(/^hostile::cells_/)
'''
test-group = "memory-heavy"

# The four tests that take more than 30 seconds on their own. Measured in the workspace's test profile, the gate's: one at a time at a machine
# load of 29 to 35 on 36 cores (alone), and in the whole workspace run at the gate's width inside a scope of 800% CPU (at the gate):
#   alone, at the gate, in seconds
#   66, 70  odg_hold four rounds of formatting eight groups of 20,000 (a child under `ulimit -v 3000000`: 6.6 s to open the file, 32 `shape.format` commands of
#           1.9 s each, 0.9 s for the save that is refused for memory; one thread)
#   62, 67  odg_hold 45,000 rectangles added after a save (55,000 shapes in two saves, in the test's own process)
#   54, 50  write_memory 250 big attributes past the gate (two children, a file of 189 MB, at 2.6 and at 3.0 GB of address space)
#   37, 38  odg_memory an edit and a save of 350,000 rectangles (a child under `ulimit -v 3000000`)
# A fifth, is listed with them: write_groups_cost, 60,000 new groups of one member saved, takes 22 to 26 s alone, which a loaded machine takes past the 30 s
# of the default period (measured alone only; it is not one of the four above, and has no gate figure of its own). A sixth: odg_untouched_routes's chains
# of edits, saved and undone, took 65 s alone on a machine at a load of 17 to 49 (2026-11-22), and in the whole run on an Intel Mac of 2019 at 12 threads it
# ran past the 120 seconds and failed; alone there it took 66 s. A seventh: the child test of `save_check_before`, which asks about a part of 256 MiB and saves it nine times under
# `ulimit -v 3000000` (26 s alone, 2026-11-25).
# Gates of many agents run together on one machine, and at a load of 66 the first of them ran past the 120 seconds above and failed a gate that had nothing wrong.
# The first was tried at a smaller size: without its 175,000 loose rectangles it ends in the same refusal (more than 2,766 MiB of memory a save may hold) with a
# third less CPU time (38 s against 58 s), which leaves the other three as slow as they are, and the loose rectangles are part of the input the review named; so
# its input stays, and the other three were not shrunk. Each of the four is reported as slow every 60 seconds and killed and failed after ten of them, 600 seconds,
# nine times what the slowest takes alone, and a test that waits for ever is still ended. The tests do not assert time; this decides only how long the gate waits.
[[profile.default.overrides]]
filter = '''
      test(=odg_hold::a_save_after_four_rounds_of_formatting_eight_groups_of_20000_ends_as_a_save_or_a_refusal_and_does_not_abort) |
      test(=odg_hold::rectangles_added_after_a_save_of_35000_are_saved_too_and_the_first_are_given_again_and_not_flattened_again) |
      test(=odg_memory::an_edit_and_a_save_of_300000_rectangles_through_the_engine_ends_as_a_save_or_a_refusal_and_does_not_abort) |
      test(=write_memory::a_save_of_the_file_with_250_big_attributes_past_the_gate_never_aborts_where_memory_runs_out) |
      test(=write_groups_cost::the_members_of_new_groups_are_gathered_once_for_each_and_sixty_thousand_groups_of_one_member_are_saved) |
      test(=odg_untouched_routes::w1_over_chains_of_edits_saves_and_undos_no_route_of_the_file_parts_from_the_model_in_silence) |
      test(=save_check_before::children::a_dry_run_with_no_room_refuses_in_words_in_a_child_and_one_with_room_gives_it_back)
'''
slow-timeout = { period = "60s", terminate-after = 10 }
