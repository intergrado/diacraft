[package]
name = "diacraft-prefs"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "DiaCraft settings: the person's config.toml and the dictionary and AutoCorrect files beside it, on craft-settings, bounded and named"
publish = false

[lints]
workspace = true

# Standalone (layer 0): no workspace crate at all, so that its hostile-input parts have a fuzz target and proofs of their own, below the engine (design 7.1).
[dependencies]
# Crash-safe replacement of a file: a temporary file beside the target, then a rename (the files beside `config.toml`).
craft-atomic = { workspace = true }
# `config.toml` in the platform's config folder, saved atomically with a backup, a broken file moved aside, a newer one left alone. On the web it has the trait and the TOML helpers only.
craft-settings = { workspace = true }
# A change is named by reading the keys of the value before and after (`change.rs`).
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
toml_edit = { workspace = true }
# `Instant` that also works in the browser, for the wait before a failed write is tried again.
web-time = { workspace = true }
# The first editing language of a new profile is the system's.
sys-locale = { workspace = true }

[dev-dependencies]
# The random inputs of `tests/it/prefs_fuzz.rs`.
proptest = { workspace = true }
