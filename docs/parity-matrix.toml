# DiaCraft feature comparison matrix: the data of the comparison page of the website.
# How to read it, the rules and the sources are in docs/parity-matrix.md. Cells come from public documentation, not from
# running the apps; LibreOffice was also run as a black box to read its file filters, Gallery themes and shape handles.

version = 1
checklist = "docs/parity-checklist.md"
values = ["Full", "Partial", "Not yet", "unknown"]

[rules]
diacraft = "checklist: Full if every checklist row named is D, Not yet if every one is M, otherwise Partial; manual: the value given, re-read from its doc at each release"
reference = "Full for a row of checklist rows (they are the reference app's desktop features); edition from the vendor's comparison of its plans; other rows say why"
others = "from the product's public documentation; unknown where no source settles it; the page shows unknown as ?"
only = "an item is listed as DiaCraft only when every published column lacks it (lacks = \"yes\")"

[sources]
inventory = "the checklist rows: features of the reference app's desktop edition, each from the vendor's public support pages, read 2026-10-31"
compare-plans = "the vendor's public page comparing its versions and plans, read 2026-10-31"
mcp-server-docs = "the vendor's public documentation of its desktop MCP server, read 2026-11-26"
absent = "not found in the documentation read"

